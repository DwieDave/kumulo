name: prod-bny
provider: ovh
distro: k3s
version: v1.31.4+k3s1
auth:
  method: application_credential
  region: GRA11
network:
  cidr: 10.0.0.0/16
  public_access: bastionless
api_server:
  high_availability: true
  allowed_cidrs:
    - 203.0.113.0/24
ssh:
  public_key_path: ~/.ssh/id_ed25519.pub
  allowed_cidrs:
    - 203.0.113.0/24
masters:
  flavor: b3-8
  count: 3
  image: ubuntu-24.04
worker_pools:
  - name: general
    flavor: b3-16
    count: 3
    labels:
      workload: general
dns:
  module: bunny
  zone: example.com
  ttl: 300
  records:
    - name: api.prod-bny
      target: api_server
    - name: app
      target: cdn
volumes:
  module: cinder
  managed: []
object_storage:
  module: bunny
  buckets:
    - name: prod-bny-backups
      region: DE
      tier: standard
      retain: true
cdn:
  module: bunny
  name: prodbny
  origin:
    url: https://203.0.113.10
  hostnames:
    - app.example.com
secrets:
  sink: sops
  dir: ./secrets
  sops:
    age_recipient: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqql4pcnf
addons:
  cloud_controller_manager: true
  csi:
    enabled: true
    default_volume_type: high-speed
  system_upgrade_controller: true
  cni: cilium
k3s:
  extra_server_args: []
  extra_agent_args: []
