# yaml-language-server: $schema=../kumulo.schema.json
name: staging-eu
provider: ovh
distro: ovh-mks
version: 1.35.0
auth:
  method: application_credential
  region: DE1
# Optional. Omit it and the cluster lands on OVH's default public addressing.
# Set at cluster creation and never changeable afterwards.
network:
  cidr: 10.0.0.0/16
  nodes_subnet: 10.0.1.0/24
  load_balancers_subnet: 10.0.2.0/24
# Optional, and only alongside `network`. Present means kumulo creates one empty
# public Octavia load balancer with a floating IP; an in-cluster Service adopts
# it by id and the cloud-controller-manager owns its listeners and pools.
ingress:
  # Octavia flavor. `flavor` names one (MKS Free sizes small/medium/large),
  # `flavor_id` gives a UUID (MKS Standard) — one or the other, never both.
  # Omit entirely for Octavia's default. An unknown name fails naming what the
  # region does offer, so `openstack loadbalancer flavor list` is the check.
  flavor: small
worker_pools:
  - name: general
    flavor: d2-4
    count: 1
    labels:
      workload: general
    autoscaling:
      enabled: true
      min: 1
      max: 1
# `api_server` resolves to the MKS control-plane hostname (a CNAME); `ingress`
# resolves to the floating IP kumulo allocated for the LB above (an A record) —
# which is what lets one apply point DNS at the ingress without waiting for any
# in-cluster workload to appear. Change `zone` to one you own, or set
# `module: none` to skip DNS entirely.
dns:
  module: hetzner
  zone: example.com
  ttl: 300
  records:
    - name: api.staging-eu
      target: api_server
    - name: apps.staging-eu
      target: ingress
    - name: "*.apps.staging-eu"
      target: ingress
volumes:
  module: cinder
  managed:
    - name: staging-eu-data
      size_gb: 10
      type: classic
      retain: false
      pvc:
        namespace: default
        access_modes:
          - ReadWriteOnce
object_storage:
  module: ovh
  buckets:
    - name: staging-eu-backups
      region: DE
      versioning: false
      encryption: false
      retain: false
    - name: staging-eu-logs
      region: DE
      versioning: true
      encryption: false
      retain: false
secrets:
  sink: sops
  dir: .
  sops:
    age_recipient: age1xv0gzkxnvr08jtqyfjmcqd0qrfxlg4vu0gwnjradd4dy6ufh5v0sgd6c3t
