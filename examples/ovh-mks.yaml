name: staging-eu
provider: ovh
distro: ovh-mks
version: 1.31.1
auth:
  method: application_credential
  region: GRA11
network:
  cidr: 10.1.0.0/16
  public_access: nat
api_server:
  high_availability: true
  allowed_cidrs:
    - 203.0.113.0/24
ssh:
  public_key_path: ~/.ssh/id_ed25519.pub
  allowed_cidrs:
    - 203.0.113.0/24
masters:
  flavor: b3-8
  count: 3
  image: ubuntu-24.04
worker_pools:
  - name: general
    flavor: b3-16
    count: 3
    labels:
      workload: general
    autoscaling:
      enabled: true
      min: 3
      max: 8
dns:
  module: none
  zone: example.com
  ttl: 300
  records: []
volumes:
  module: cinder
  retained: []
addons:
  cloud_controller_manager: true
  cinder_csi:
    enabled: true
    default_volume_type: high-speed
  system_upgrade_controller: false
  cni: flannel
k3s:
  extra_server_args: []
  extra_agent_args: []
