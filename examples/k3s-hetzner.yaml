name: prod-fsn
provider: hetzner
distro: k3s
version: v1.31.4+k3s1
auth:
  method: api_token
  region: fsn1
network:
  cidr: 10.0.0.0/16
  public_access: bastionless
api_server:
  high_availability: true
  allowed_cidrs:
    - 203.0.113.0/24
ssh:
  public_key_path: ~/.ssh/id_ed25519.pub
  allowed_cidrs:
    - 203.0.113.0/24
masters:
  flavor: cx32
  count: 3
  image: ubuntu-24.04
worker_pools:
  - name: general
    flavor: cx42
    count: 3
    labels:
      workload: general
dns:
  module: hetzner
  zone: example.com
  ttl: 300
  records:
    - name: api.prod-fsn
      target: api_server
volumes:
  module: hcloud
  managed:
    - name: postgres-data
      size_gb: 100
      type: default
      retain: true
      pvc:
        namespace: db
        access_modes:
          - ReadWriteOnce
object_storage:
  module: none
secrets:
  sink: none
addons:
  cloud_controller_manager: true
  cinder_csi:
    enabled: false
    default_volume_type: high-speed
  hcloud_csi:
    enabled: true
  system_upgrade_controller: true
  cni: cilium
k3s:
  extra_server_args:
    - "--disable=traefik"
  extra_agent_args: []
